<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face{
    font-family:"Montserrat";
    src:url("../../fonts/montserrat-variable.woff2") format("woff2");
    font-weight:100 900; font-style:normal; font-display:block;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--azure:#159BD7; --navy:#1C3F6E; --sky:#4FB8E6; --mist:#EAF6FC;}
  html,body{width:1080px;height:1080px;overflow:hidden}
  .stage{
    position:relative;width:1080px;height:1080px;
    background:radial-gradient(120% 100% at 50% 44%, #ffffff 0%, #F4FBFE 55%, var(--mist) 100%);
    font-family:"Montserrat",sans-serif;-webkit-font-smoothing:antialiased;
  }
  .bg{position:absolute;inset:0;width:1080px;height:1080px}
  .content{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:96px;
  }
  .eyebrow{display:inline-flex;align-items:center;gap:14px;font-size:25px;font-weight:600;
    letter-spacing:.42em;color:var(--azure);text-transform:uppercase;margin-bottom:46px}
  .eyebrow .ln{width:44px;height:2px;background:var(--azure);opacity:.6}
  .logo{margin-bottom:42px}
  .wordmark{font-weight:800;font-size:150px;line-height:.92;letter-spacing:-.03em}
  .wordmark .azure{color:var(--azure)} .wordmark .navy{color:var(--navy)}
  .sub{margin-top:4px;text-align:left;font-weight:600;font-size:60px;color:var(--sky);padding-left:8px}
  .divider{width:90px;height:4px;border-radius:4px;background:var(--azure);margin:6px 0 38px}
  .headline{font-weight:600;font-size:68px;letter-spacing:-.01em;color:var(--navy)}
  .headline .accent{color:var(--azure)}
  .dots{display:flex;gap:18px;margin-top:42px}
  .dots i{width:15px;height:15px;border-radius:50%;background:var(--sky);opacity:.5}
  .dots i:nth-child(2){opacity:.75} .dots i:nth-child(3){opacity:1;background:var(--azure)}
</style>
</head>
<body>
  <div class="stage">
    <svg class="bg" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#159BD7" fill="none">
        <circle cx="540" cy="540" r="235" stroke-width="2.5" opacity="0.30"/>
        <circle cx="540" cy="540" r="375" stroke-width="2.5" opacity="0.20"/>
        <circle cx="540" cy="540" r="525" stroke-width="2.5" opacity="0.13"/>
        <circle cx="540" cy="540" r="690" stroke-width="2.5" opacity="0.07"/>
      </g>
      <g fill="#4FB8E6">
        <circle cx="210" cy="250" r="10" opacity="0.5"/>
        <circle cx="880" cy="210" r="13" opacity="0.45"/>
        <circle cx="930" cy="560" r="8" opacity="0.5"/>
        <circle cx="150" cy="600" r="11" opacity="0.4"/>
        <circle cx="860" cy="880" r="10" opacity="0.5"/>
        <circle cx="210" cy="900" r="13" opacity="0.4"/>
      </g>
      <g fill="#1C3F6E">
        <circle cx="760" cy="360" r="7" opacity="0.5"/>
        <circle cx="300" cy="800" r="8" opacity="0.45"/>
      </g>
    </svg>
    <div class="content">
      <div class="eyebrow"><span class="ln"></span>Coming soon<span class="ln"></span></div>
      <div class="logo">
        <div class="wordmark"><span class="azure">Logix</span><span class="navy">X</span></div>
        <div class="sub">Fertility</div>
      </div>
      <div class="divider"></div>
      <div class="headline">More is <span class="accent">coming</span></div>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
  </div>
</body>
</html>
